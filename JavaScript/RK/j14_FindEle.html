<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finding HTML Elements</title>
    <style>
        .highlight {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1 id="unique-element">Welcome to Finding HTML Elements</h1>
    <p class="highlight">This is the first paragraph with a class.</p>
    <p>This is the second paragraph without a class.</p>
    <p class="highlight">This is the third paragraph with a class.</p>
    
    <form name="searchForm">
        <input type="text" placeholder="Search...">
    </form>
    
    <form>
        <input type="text" placeholder="Another form...">
    </form>
    
    <img src="off.jpg" alt="Image 1">
    <img src="on.jpg" alt="Image 2">
    
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>

<body>
    <h2>What Can JavaScript Do?</h2>
    <p id="demo1">JavaScript can change HTML content.</p>
    <button type="button" onclick='document.getElementById("demo1").innerHTML = "Hello JavaScript!"'>Click Me!</button>

    <button onclick="document.getElementById('myImage').src='on.jpg'">Turn on the light</button>
    <img id="myImage" src="off.jpg" style="width:100px">
    <button onclick="document.getElementById('myImage').src='off.jpg'">Turn off the light</button>

    <p id="demo2">JavaScript can change the style of an HTML element.</p>
    <button type="button" onclick="document.getElementById('demo2').style.fontSize='35px'">Click Me!</button>

    <br>
    <button type="button" onclick="document.getElementById('demo2').style.display='none'">Click Me!</button>
    <br>
    <button type="button" onclick="document.getElementById('demo2').style.display='block'">Click Me!</button>

</body>

</html>
